<title>中文练功房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f4ba8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" media="print" id="fontcss">
<style>
/* Layout: one phone-width column, bottom tab bar; practice cards fill the column. Grid-paper (稿纸) answer boxes are the signature detail. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#18202b; --muted:#5b6676; --line:#dce1e8;
  --accent:#2f4ba8; --accent-ink:#ffffff; --accent-soft:#e3e8f7;
  --good:#1d8566; --good-soft:#dcf1ea; --bad:#c2412d; --bad-soft:#f8e2dd; --gold:#a77a14; --gold-soft:#f5ead0; --plum:#8a4fbf;
  --grid:rgba(47,75,168,.10);
  --f-ui:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong","SimSun","PingFang SC",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12; --plum:#c39bf0;
  --grid:rgba(142,166,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12; --plum:#c39bf0;
  --grid:rgba(142,166,255,.12); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
*,*::before,*::after{touch-action:manipulation} /* no double-tap zoom when tapping answers quickly; pinch zoom still works */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:.01em}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.zh{font-family:var(--f-zh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.updline{flex-direction:row;align-items:center;gap:10px;padding:10px 12px} .updline>span{flex:1} .updline .btn{min-height:40px;padding:6px 14px}
.fpick{position:relative;cursor:pointer}.fpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip.news{background:var(--gold-soft)} .chip.book{background:var(--good-soft)} .chip.wb{background:var(--bad-soft)}
.reading.wb p+p{border-left:3px solid var(--line);padding-left:12px;margin-left:2px;font-size:.96em}
.reading.wb.douyin p:first-of-type{color:var(--muted)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .date{font-size:13px;color:var(--muted)}
/* time buttons */
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn.start{font-size:18px;min-height:56px}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.goal{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.goal.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.time{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.time b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.time span{font-size:12px;color:var(--muted)}
.time.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.time.hot span{color:inherit;opacity:.8}
.mix{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:600px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12px}
nav.tabs button .zh{font-size:18px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* session */
.sbar{display:flex;align-items:center;gap:12px}
.cells{flex:1;display:flex;gap:3px;flex-wrap:wrap}
.cells i{flex:1 0 8px;max-width:22px;height:8px;border-radius:2px;background:var(--line)}
.cells i.ok{background:var(--good)} .cells i.no{background:var(--bad)} .cells i.now{background:var(--accent)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;font-size:14px}
.dnote{margin:0 0 10px;padding:7px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-size:14px;transition:opacity .5s}
.dnote.gone{opacity:0}
.setdone{color:var(--good);font-weight:600}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted)}
.kind{display:flex;justify-content:space-between;align-items:center}
.prompt-en{font-size:19px;line-height:1.45;font-weight:500}
.sent{font-family:var(--f-zh);font-size:23px;line-height:1.75;overflow-wrap:anywhere}
.sent mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 2px;text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.5}
.opt.zh{font-size:19px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
/* tiles */
.built{min-height:62px;border-radius:12px;border:1px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 30px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-zh);font-size:19px;padding:7px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid transparent}
.tile.used{visibility:hidden}
/* grid-paper answer */
.paper{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--f-zh);font-size:22px;line-height:34px;color:var(--ink);
  background-color:var(--surface);background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px);background-size:34px 34px;background-position:9px 7px}
.hint{font-size:14px;color:var(--muted)} .hint b{font-family:var(--f-zh);color:var(--ink);font-size:17px}
/* feedback */
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.mid{background:var(--gold-soft)}
.fb .verdict{font-weight:700;font-size:15px}
.fb .model{font-family:var(--f-zh);font-size:19px;line-height:1.6}
.fb ul{margin:0;padding-left:18px}
.fb .alts{font-family:var(--f-zh);font-size:15px;color:var(--muted)}
/* segmentation */
.segline{display:flex;flex-wrap:wrap;row-gap:12px;font-family:var(--f-zh);font-size:25px;line-height:1}
.segline .c{position:relative;padding:6px 7px;border-radius:6px}
.segline .c.tap{cursor:pointer}
.segline .c.tap:hover{background:var(--accent-soft)}
.segline .c.cut::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--accent)}
.segline .c.miss::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--bad)}
.segline .c.extra::after{background:var(--bad);opacity:.35}
.segline .c.p{color:var(--muted)}
.chunks{font-family:var(--f-zh);font-size:19px;line-height:1.9}
.chunks span{border-bottom:2px solid var(--accent);margin-right:8px;white-space:nowrap}
.how{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.how-ex{font-size:20px}
.how-ex i,.chunks i.may{display:inline-block;width:0;height:1em;margin:0 6px;vertical-align:-2px}
.how-ex i.must{border-left:3px solid var(--accent)}
.how-ex i.may,.chunks i.may{border-left:2px dotted var(--muted)}
.frames{display:flex;flex-direction:column;gap:4px;font-size:14px}
.frames b{font-family:var(--f-zh);font-size:17px;margin-right:8px}
.syncwarn{background:var(--bad-soft)}
.offline{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
/* reader */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pitem h3{font-family:var(--f-zh);font-size:18px;font-weight:700}
.reading{font-family:var(--f-zh);font-size:21px;line-height:2;display:flex;flex-direction:column;gap:14px}
.reading p{overflow-wrap:anywhere}
.tk{cursor:pointer;border-radius:4px;white-space:nowrap}
.tk:hover{background:var(--accent-soft)}
.tk.looked{background:var(--gold-soft)}
.kf{display:flex;flex-direction:column;height:calc(100dvh - 48px);gap:8px}
.kfsong{display:flex;flex:1 1 auto;min-width:0;white-space:nowrap} .kfti{overflow:hidden;text-overflow:ellipsis;min-width:0} .kfpn{flex:none}
.kf .sbar{gap:8px} .kfbtns{gap:6px;flex:none;flex-wrap:nowrap;margin-left:auto} .kfbtns .tagc{padding-left:9px;padding-right:9px}
.kfview{position:relative;flex:1;overflow:hidden;display:flex;align-items:center}
.kfcol{width:100%}
html.bklock,html.bklock body{overflow:hidden;overscroll-behavior:none;height:100%} html.bklock main{padding-bottom:8px}
.bkbar{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0;margin-bottom:-8px}
.bkbar .bkt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkfb{position:sticky;top:54px;z-index:5;background:var(--accent-soft);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;margin-bottom:-8px}
.bk{font-family:var(--f-zh);line-height:2}
.bk p{margin:0 0 .8em;text-indent:2em;overflow-wrap:anywhere}
.bk p.bkh{text-indent:0;font-weight:700;font-size:1.12em;text-align:center;margin:1.4em 0 .9em}
.bk .tk.hit{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.bkpw{overflow:hidden;touch-action:pan-y}
.bkpi{column-fill:auto;transition:transform .2s ease}
.bkpb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:env(safe-area-inset-bottom,0px)}
.bkpb button{font-size:26px;line-height:1;padding:6px 22px;border-radius:12px;border:1px solid var(--line);background:var(--surface)} .bkpb button:disabled{opacity:.35}
.bkprog{height:5px;border-radius:3px;background:var(--line);overflow:hidden} .bkprog i{display:block;height:100%;background:var(--accent)}
.bkrow h3{font-size:17px} .bkrow{gap:10px}
.bktoc,.bkres{display:flex;flex-direction:column;gap:6px}
.bktoc button,.bkres button{text-align:left;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.bkres button{flex-direction:column;gap:2px} .bktoc button.on{border-color:var(--accent);background:var(--accent-soft)}
.bkres mark{background:var(--gold-soft);color:inherit;border-radius:3px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.bk .ts.on{background:color-mix(in srgb, var(--accent) 16%, transparent);border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ttsbar{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:4px;margin:6px -6px 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.ttsb{min-width:42px;min-height:42px;border:0;background:none;color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0}
.ttsb:active{background:var(--accent-soft)} .ttsplay{min-width:54px;min-height:54px;background:var(--accent);color:var(--accent-ink)} .ttsplay:active{background:var(--accent)}
.ttssrc{flex:0 0 auto;font-size:15px;min-width:18px;text-align:center}
.ttsrate{border-radius:14px;padding:0 10px;font-weight:700;font-size:15px;border:1px solid var(--line)}
.ttsrp{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;animation:ttsup .18s ease-out}
@keyframes ttsup{from{transform:translateY(40px);opacity:0}}
.ttsnv{align-items:stretch;text-align:left;gap:8px;max-height:80vh;overflow-y:auto}
.ttsrv{font-size:34px;font-weight:700;line-height:1.1}
.ttsrw{position:relative;width:100%;max-width:460px}
.ttsrc{position:absolute;left:50%;top:0;width:3px;height:30px;margin-left:-1.5px;background:var(--accent);border-radius:2px;z-index:1;pointer-events:none}
.ttsr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 0 4px;outline:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.ttsr::-webkit-scrollbar{display:none}
.ttst{flex:0 0 40px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ttst i{display:block;width:2px;height:16px;margin-top:7px;background:var(--muted);border-radius:1px} .ttst.big i{height:24px;margin-top:3px;width:2.5px}
.ttst b{font-size:11px;font-weight:600;color:var(--muted);height:14px;white-space:nowrap} .ttst.on b{color:var(--ink)}
.ttsvsel{max-width:62%;font-size:16px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ttslk{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.06);touch-action:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.ttsunl{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:10px 18px;font-size:14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.ttsunl i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-soft)} .ttsunl.hold i{width:100%;transition:width 1.2s linear} .ttsunl span{position:relative}
.ghp{border-radius:4px;transition:background-color .15s,box-shadow .15s} .ghp.gh{background:color-mix(in srgb, var(--accent) 20%, transparent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent)}
html.kflock,html.kflock body{overflow:hidden;overscroll-behavior:none;height:100%}
.kf{touch-action:none;overscroll-behavior:none}
.kfcol.turn .kfl:not(.off){animation:kfin .3s ease}
@keyframes kfin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kfl{position:relative;display:flex;align-items:center;gap:6px;justify-content:center;font-family:var(--f-zh);text-align:center;padding:10px 4px;line-height:1.7;font-size:clamp(24px,7vw,36px);box-sizing:border-box;width:100%;max-width:100%;user-select:none;-webkit-user-select:none}
.kfl.cur{color:var(--accent);font-weight:700}
.kfl.sung{opacity:.4} .kfl.off{display:none}
.kft{flex:0 1 auto;min-width:0;letter-spacing:.03em;word-break:break-all;overflow-wrap:anywhere}
.kfre{flex:none;border:0;background:none;color:var(--muted);font-size:15px;padding:6px;cursor:pointer;opacity:.7}
.kfl.cur .kfre{visibility:hidden}
.kfc{position:relative;cursor:pointer;border-radius:6px;padding:0 1px}
.kfc.kx{background:var(--gold-soft)} /* not .x: that's the close buttons' class (18 px) */ .kfc .kpyl{position:absolute;left:50%;bottom:86%;transform:translateX(-50%);font-family:var(--f-ui,inherit);font-size:.36em;font-weight:500;line-height:1;letter-spacing:0;white-space:nowrap;color:var(--gold);pointer-events:none}
.kfdots{position:absolute;top:-4px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.kfdots i{width:12px;height:12px;border-radius:50%;background:var(--accent);transition:opacity .15s}
.kfdots i.off{opacity:.12}
.kfpz{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);text-align:center;background:var(--surface);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.kfnote{min-height:1.2em;text-align:center;margin:0}
.kfhint{text-align:center;margin:0 0 max(8px,env(safe-area-inset-bottom,0px))}
#kfpop .kch{font-size:56px;font-weight:700;line-height:1.1} #kfpop .kpy{font-size:28px;font-weight:700;color:var(--accent)}
#kfpop .kwd{color:var(--muted)} #kfpop .kwd .zh{font-size:17px;color:var(--ink,inherit)}
.spaced .tk{margin-right:.32em;box-shadow:inset 0 -2px 0 var(--line)}

<script>
// fonts load without holding up the first draw (was an inline onload, which the script lock in build.sh would block)
{ const fl = document.getElementById("fontcss"); if (fl) { if (fl.sheet) fl.media = "all"; else fl.addEventListener("load", () => { fl.media = "all"; }); } }
"use strict";
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PUNCT_RE = /[\p{P}\p{S}\s]/u;
const isPunct = ch => PUNCT_RE.test(ch) || /\p{Extended_Pictographic}/u.test(ch);
const norm = s => Array.from(String(s || "")).filter(c => !isPunct(c)).join("").replace(/儿(?=[^一-鿿]|$)/g, "儿");
let CLOCK_OFF = 0, SIM = false; // the stock-up forecast fast-forwards a copy of your progress
const now = () => Date.now() + CLOCK_OFF;
const DAY = 864e5, MIN = 6e4;
// The app's day starts at 3:38 am local time, the same time as Claude's nightly run (2026-11-10, learner: practice
// after midnight still belongs to "today"). dayOf = the calendar date the app counts a moment under; dayKey = its
// label; midnight() (below) = when that app day began; dayAt(key) = when a given app day begins.
const DAY_START_MIN = 3 * 60 + 38;
const dayOf = t => { const d = new Date(t); if (d.getHours() * 60 + d.getMinutes() < DAY_START_MIN) d.setDate(d.getDate() - 1); return d; };
const dayAt = key => { const d = new Date(key + "T00:00"); d.setHours(0, DAY_START_MIN, 0, 0); return d.getTime(); };
const dayKey = (t = now()) => { const d = dayOf(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
/* Error log (v68): failures that used to vanish in an empty catch are noted here, so a phone-only problem can be
   copied into a chat (Progress → 出错记录 · Error log). This device only, not synced; last ERR_MAX entries; the same
   error repeated in a row is counted, not stored again. Never throws (it's called from inside catch blocks). */
const ERR_KEY = "zwlgf:errlog", ERR_MAX = 30;
let ERRS = null;
function errList() { if (!ERRS) { try { ERRS = JSON.parse(localStorage.getItem(ERR_KEY) || "[]"); } catch (e) { ERRS = []; } if (!Array.isArray(ERRS)) ERRS = []; } return ERRS; }
function noteErr(where, e) {
  try {
    const msg = String((e && (e.message || e.code || (e.status && "HTTP " + e.status))) || e || "?").slice(0, 300) + (e && e.code && e.message ? ` [${e.code}]` : "");
    let v = ""; try { v = APP_VERSION; } catch (x) {}
    const L = errList(), last = L[L.length - 1];
    if (last && last.w === where && last.m === msg) { last.n = (last.n || 1) + 1; last.t = Date.now(); }
    else L.push({ t: Date.now(), w: String(where), m: msg, v: v.split(" ")[0] });
    while (L.length > ERR_MAX) L.shift();
    try { localStorage.setItem(ERR_KEY, JSON.stringify(L)); } catch (x) {}
  } catch (x) {}
}
addEventListener("error", e => noteErr("uncaught", e.error || { message: e.message + (e.filename ? ` (${String(e.filename).split("/").pop()}:${e.lineno})` : "") }));
addEventListener("unhandledrejection", e => noteErr("uncaught (promise)", e.reason));
function errCard() {
  const L = errList(); if (!L.length) return "";
  const when = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  return `<div class="card stack" id="errcard"><span class="label">出错记录 · Error log</span>
    <p class="small muted">后台出过的错，只存在这台设备上。有问题时复制给 Claude 看 · Things that failed quietly in the background, kept on this device only. If something seems wrong, copy this into a chat with Claude.</p>
    <div class="small" style="max-height:180px;overflow:auto">${L.slice().reverse().map(x => `<div>${when(x.t)} · <b>${esc(x.w)}</b>${x.n > 1 ? ` ×${x.n}` : ""}: ${esc(x.m)}</div>`).join("")}</div>
    <div class="row"><button class="btn soft" id="err-copy">复制 Copy</button><button class="btn ghost" id="err-clear">清空 Clear</button></div></div>`;
}
function bindErrCard(main) {
  const c = $("#err-copy", main); if (c) c.onclick = () => navigator.clipboard.writeText(errList().map(x => `${new Date(x.t).toISOString()} ${x.v} ${x.w}${x.n > 1 ? " x" + x.n : ""}: ${x.m}`).join("\n") + `\n${navigator.userAgent}`).then(() => toast("复制了 · Copied"), () => toast("复制不了 · Couldn't copy"));
  const k = $("#err-clear", main); if (k) k.onclick = () => { ERRS = []; try { localStorage.removeItem(ERR_KEY); } catch (e) {} render(); };
}
function toast(msg, ms = 2200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); placeToasts(); setTimeout(() => t.remove(), ms); }
// Keep toasts at the top of what you can actually see, at normal size, even when the page is zoomed in.
function placeToasts() {
  const v = window.visualViewport;
  $$(".toast").forEach(t => {
    if (!v || v.scale <= 1.01) { t.style.cssText = ""; return; }
    t.style.left = (v.pageLeft + v.width / 2) + "px";
    t.style.top = (v.pageTop + 12 / v.scale) + "px";

if (window.visualViewport) { visualViewport.addEventListener("resize", placeToasts); visualViewport.addEventListener("scroll", placeToasts); }
const uid4 = () => Math.random().toString(36).slice(2, 6);
const pct = x => Math.round((x || 0) * 100) + "%";

/* ============ state & storage ============ */
const LS_KEY = "zwlgf:state:v1";
const OFFW_MAX = 300; // answers waiting to be graded later (offline copy: graded automatically; was 50 before step 3)
function freshState() {
  return { v: 1, updatedAt: 0, placed: false, skills: null, items: {}, recent: {}, log: {}, bank: {}, reads: {}, gen: { ladder: [], passages: [], sen: [], mine: [], listen: [], fw: [] }, best: { combo: 0 } };
}
let S = freshState();
/* Saving on this device (v68). Progress is one localStorage entry (browsers allow ~5 MB; real progress was ~320 KB
   in Nov 2026). Two things used to go wrong silently:
   - the entry couldn't be read (damaged): the app started empty and its next save wrote over the old copy. Now the
     unreadable text is first copied to BAD_KEY; if even that copy fails, nothing is written to this device until
     the copy is dealt with (LOCAL_HOLD), so the original is never lost. Home card: storeCard().
   - a save failed (storage full): only a flag was set. Now LOCAL_FULL shows a home card (and a toast once mid-session);
     it clears on the next save that works. GitHub sync still sends the in-memory progress either way. */
const BAD_KEY = "zwlgf:state:unreadable";
let LOCAL_FULL = false, LOCAL_HOLD = false;
{
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { noteErr("load: read", e); }
  if (raw) {
    try { S = Object.assign(freshState(), JSON.parse(raw)); }
    catch (e) {
      noteErr("load: unreadable progress", e);
      let have = null; try { have = localStorage.getItem(BAD_KEY); } catch (e2) {}
      if (have === null) { try { localStorage.setItem(BAD_KEY, raw); } catch (e2) { LOCAL_HOLD = true; noteErr("load: keeping a copy", e2); } }
      else if (have !== raw) LOCAL_HOLD = true; // an older unreadable copy is already kept: don't write over this one either
    }
  }
}
function badCopy() { try { return localStorage.getItem(BAD_KEY); } catch (e) { return null; } }
// every write of the progress to this device goes through here
function writeLocal(json) {
  if (LOCAL_HOLD) return false;
  try { localStorage.setItem(LS_KEY, json); }
  catch (e) {
    if (!LOCAL_FULL) { LOCAL_FULL = true; noteErr("save: storage full", e); toast(COL ? "这台设备存不下了，进度还在同步到 GitHub · This device's storage is full; progress still syncs to GitHub" : "这台设备存不下了：关掉 app 之前先导出一份 · This device's storage is full: copy a code before closing the app", 6000); if (VIEW === "home") render(); }
    return false;
  }
  if (LOCAL_FULL) { LOCAL_FULL = false; if (VIEW === "home") render(); }
  return true;
}
function storeCard() {
  const bad = badCopy();
  if (!LOCAL_FULL && !LOCAL_HOLD && bad === null) return "";
  const gh = !!(ghCfg() || {}).token;
  let h = "";
  if (LOCAL_FULL) h += `<div class="card stack" style="border-color:var(--bad)"><span class="label">这台设备存不下了 · Storage full on this device</span>
    <p class="small">最近的进度没能存在这台设备上。${gh ? "它还在同步到 GitHub，联网时不会丢。" : "关掉 app 就会丢，先到 进度 → 导出 复制一份代码。"}<br>Your latest progress couldn't be saved on this device. ${gh ? "It still syncs to GitHub, so nothing is lost while you're online; offline, answers since then would be lost if the app is closed." : "It will be lost when the app closes: copy a code first (进度 → 导出 Copy code)."} This message goes away by itself once saving works again.</p></div>`;
  if (LOCAL_HOLD || bad !== null) h += `<div class="card stack" style="border-color:var(--bad)"><span class="label">进度读不出来 · Saved progress couldn't be read</span>
    <p class="small">这台设备上存的进度坏了，读不出来。原来那份没有删，${LOCAL_HOLD ? "这台设备暂时不再存新的进度，免得盖掉它。" : "另存了一份。"}${gh ? "你的进度会从 GitHub 自动拿回来。" : ""}<br>The progress saved on this device was damaged and couldn't be read. The original is kept, not deleted${LOCAL_HOLD ? "; until it's dealt with, this device doesn't save new progress, so nothing writes over it" : ""}. ${gh ? "Your progress comes back from GitHub automatically; check it looks right (进度 Progress), then remove the kept copy." : "Copy it and paste it into a chat with Claude, who can try to rescue it; then remove the kept copy."}</p>
    <div class="row"><button class="btn soft" id="bad-copy">复制原来那份 Copy the original</button><button class="btn ghost" id="bad-del">删掉原来那份 Remove it</button></div></div>`;
  return h;
}
function bindStoreCard(main) {
  const c = $("#bad-copy", main); if (c) c.onclick = () => { const bad = badCopy(), cur = LOCAL_HOLD ? localStorage.getItem(LS_KEY) : null; const raw = cur !== null && bad !== null && bad !== cur ? cur + "\n\n----- older unreadable copy -----\n\n" + bad : cur !== null ? cur : bad; navigator.clipboard.writeText(raw || "").then(() => toast(`复制了 ${Math.round((raw || "").length / 1024)} KB · Copied`), () => toast("复制不了 · Couldn't copy")); };

let remoteBusy = false, remoteDirty = false, remoteTimer = null;
const bytesOf = json => json.length + (json.match(/[^\x00-\x7f]/g) || []).length * 2; // UTF-8 estimate
const GEN_CAP = { ladder: 600, sen: 600, passages: 60, mine: 400, listen: 80, trash: 320, fw: 240, books: 100 }; // trash: TRASH_MAX purges properly first; this is only a backstop // mine = parts of your own texts (also limited by MINE_MAX_CHARS) // generated content kept (all of it travels offline)
function save() {
  if (SIM) return;
  S.updatedAt = now();

  for (const k in S.recent) if (S.recent[k].length > 40) S.recent[k] = S.recent[k].slice(-40);

/* ---------- account sync: progress split across several documents ----------
   Storage layout only. Your progress is still one state object in the app and merging still works on whole

  if (st.gen.books) st.gen.books = st.gen.books.filter(r => !dead("book:" + r.id, r.u || r.t));

const gradeOn = (p, id) => !(p.grade && p.grade[id] === false);
const keyFor = (p, base) => (p.base && p.base.replace(/\/+$/, "") === base ? p.key : "") || (p.keys || {})[base] || "";

function chainNote(svc, e) {

  const out = { ladder: 0, sen: 0, passages: Math.max(0, f.needPsg - f.unread), fw: Math.max(0, Math.min(GEN_CAP.fw - (S.gen.fw || []).length, cfg.days - fwFresh().length)) };
  if (f.days < cfg.days) {
    const gap = cfg.days - f.days;
    out.ladder = Math.max(8, Math.ceil((f.perDay.lad || 3) * gap * 1.2));
    out.sen = Math.max(10, Math.ceil((f.perDay.sen || 4) * gap * 1.2));
  }
  out.ladder = Math.min(out.ladder, Math.max(0, GEN_CAP.ladder - S.gen.ladder.length));
  out.sen = Math.min(out.sen, Math.max(0, GEN_CAP.sen - (S.gen.sen || []).length));
  out.passages = Math.min(out.passages, Math.max(0, GEN_CAP.passages - S.gen.passages.length));
  return out;
}
function computeOutbox() {
  autoTopUp();
  const cfg = stockCfg(), f = forecast(cfg.days, cfg.mins);
  FORECAST = f;
  OUTBOX = { v: 1, day: dayKey(), target: cfg.trip ? { mode: "trip", from: cfg.from, to: cfg.to, days: cfg.days, mins: cfg.mins } : { mode: "ahead", days: cfg.days, mins: cfg.mins },
    covered: f.days, unreadPassages: f.unread, perDay: f.perDay, short: shortage(f, cfg),
    room: { ladder: GEN_CAP.ladder - S.gen.ladder.length, sen: GEN_CAP.sen - (S.gen.sen || []).length, passages: GEN_CAP.passages - S.gen.passages.length, fw: GEN_CAP.fw - (S.gen.fw || []).length },
    reading: { perDay: readPerDay(), genres: readGenres() || "auto" },
    hints: genHints(), requests: outboxRequests().concat(checkRequests(), fwCheckRequests()), packsDone: (S.packsDone || []).slice(-60) };
  OUTBOX_AT = now(); OUTBOX_DIRTY = true;
  return OUTBOX;
}
function outboxSoon(force) {
  if (!COL) return;
  if (!force && OUTBOX && now() - OUTBOX_AT < 20 * MIN && OUTBOX.day === dayKey()) return;
  setTimeout(() => { if (busyView() && !force) return; try { computeOutbox(); remoteDirty = true; clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 3000); refreshStock(); } catch (e) { noteErr("note to Claude", e); } }, 400);
}

/* ---------- the offline copy's stock card: target + what's short + deliveries + paste a pack ---------- */

  const cfg = stockCfg(), f = FORECAST, sh = f ? shortage(f, cfg) : null, log = S.packLog || [];
  const sel = (id, opts, v, lab) => `<select id="${id}" style="font:inherit;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">${opts.map(o => `<option value="${o[0]}" ${String(o[0]) === String(v) ? "selected" : ""}>${o[1]}</option>`).join("")}</select>`;
  const st = (S.settings || {}).stock || {};
  let status = `<p class="small muted"><span class="spin"></span> 估算中… Estimating…</p>`;
  if (f) {
    const okC = f.days >= cfg.days, okP = f.unread >= f.needPsg;
    status = `<p class="small">练习卡够用 Practice cards last: <b>${okC ? `≥ ${cfg.days}` : f.days} 天 days</b> ${okC ? "✓" : `/ ${cfg.days}`}<br>没读过的短文 Unread passages: <b>${f.unread}</b> / ${f.needPsg} ${okP ? "✓" : ""}</p>
      ${sh.ladder || sh.sen || sh.passages || sh.fw ? `<p class="small">还缺 Short: ${[sh.ladder ? `${sh.ladder} 造句 drills` : "", sh.sen ? `${sh.sen} 短句 sentences` : "", sh.passages ? `${sh.passages} 短文 passages` : "", sh.fw ? `${sh.fw} 自由写题目 free-writing prompts` : ""].filter(Boolean).join(" · ")}<br><span class="muted">${COL && COL.gh ? "Claude 每天的任务会补上（大的缺口分几天）· Claude's daily run fills this (big gaps over a few days)." : "连上 GitHub 同步后，Claude 每天的任务会补上；也可以把内容包贴在下面 · With GitHub sync on, Claude's daily run fills this; or paste a pack below."}</span></p>` : `<p class="small">✓ 够了 · Nothing short.</p>`}`;
  }
  return `<div class="card" id="packcard"><span class="label">备货 · Stock</span>
    <p class="small muted">算法在这台设备上算：把真实的复习安排往后跑，看材料够几天（不用 AI）。Worked out on this device by running the real scheduler forward (no AI).</p>
    ${cfg.trip ? `<div class="row small"><b>行程 Trip: ${cfg.days} 天 days</b> · 每天 Daily ${sel("pk-mins", [["auto", `自动 Auto (≈${autoMins()} 分钟)`], [15, "15 分钟"], [30, "30 分钟"], [60, "60 分钟"], [90, "90 分钟"]], st.minsSet ? st.mins : "auto")}</div>`
      : `<div class="row small">保持领先 Keep ${sel("pk-ahead", [[1, "1 周 week"], [2, "2 周 weeks"], [3, "3 周 weeks"], [4, "4 周 weeks"]], cfg.ahead)} ahead · 每天 Daily ${sel("pk-mins", [["auto", `自动 Auto (≈${autoMins()} 分钟)`], [15, "15 分钟"], [30, "30 分钟"], [60, "60 分钟"], [90, "90 分钟"]], st.minsSet ? st.mins : "auto")}</div>`}
    <div class="row small" style="gap:6px">行程日期 Trip dates:
      <input type="date" id="pk-from" class="inp" style="width:auto;padding:5px 8px" value="${esc(cfg.from || "")}"> → <input type="date" id="pk-to" class="inp" style="width:auto;padding:5px 8px" value="${esc(cfg.to || "")}">
      ${cfg.from || cfg.to ? `<button class="btn ghost" id="pk-clr" style="min-height:34px;padding:6px 10px">清除 Clear</button>` : ""}</div>
    <div class="row small" style="gap:6px">阅读量 Reading: ${sel("pk-read", [[0.5, "两天一篇 1 every 2 days"], [1, "每天一篇 1 a day"], [2, "每天两篇 2 a day"]], readPerDay())}</div>
    <div class="row small" style="gap:10px;flex-wrap:wrap">体裁 Genres: ${PSG_GENRES.map(([k, n]) => `<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-genre="${k}" ${!readGenres() || readGenres().includes(k) ? "checked" : ""}> ${n}</label>`).join("")}${readGenres() ? "" : ` <span class="muted">(自动 auto: mostly 新闻 and 小红书)</span>`}</div>
    ${SLANG ? `<p class="small muted" id="slanginfo">热梗表 · Slang list: ${esc(SLANG.updated)} · ${SLANG.terms.length} 个 terms${slangAge() >= SLANG_OLD ? " · 该更新了 due a refresh" : ""}</p>` : ""}
    <div id="st-body">${status}</div>
    <details><summary class="small" style="cursor:pointer">多来一篇 · One more passage</summary>
      <div class="row small" style="gap:6px;margin-top:6px">${sel("pk-g1", [["", "任何体裁 Any genre"], ...PSG_GENRES], "")}</div>
      <input class="inp" id="pk-topic" placeholder="话题（可以不填）Topic (optional), e.g. 坐高铁" style="width:100%">
      <button class="btn soft" id="pk-more">请 Claude 写 · Ask Claude</button><span class="small muted"> 下次运行时送到 · arrives with the next daily run${(S.req || []).filter(x => x.kind === "passage").length ? ` (${(S.req || []).filter(x => x.kind === "passage").length} waiting)` : ""}</span></details>
    <details><summary class="small" style="cursor:pointer">想写的话题 · Topics to write about</summary>
      <p class="small muted">自由写的题目会先出这些话题 · Free-writing prompts on these come first.</p>
      <input class="inp" id="fw-topic" placeholder="话题 Topic, e.g. 做饭、换工作" style="width:100%">
      <button class="btn soft" id="fw-ask">请 Claude 出题 · Ask Claude</button><span class="small muted"> 下次运行时送到 · arrives with the next daily run${(S.req || []).filter(x => x.kind === "fwtopic").length ? ` (${(S.req || []).filter(x => x.kind === "fwtopic").map(x => esc(x.topic)).join("、")})` : ""}</span></details>
    ${heldHtml()}
    ${log.length ? `<p class="small">上次到货 Last delivery: <b>${new Date(log[0].t).getMonth() + 1}月${new Date(log[0].t).getDate()}日</b> · ${esc(packSummary(log[0]))}${log[0].bad ? ` <span class="muted">(${log[0].bad} 个格式不对，没用 · ${log[0].bad} malformed, skipped)</span>` : ""}</p>` : ""}
    <details><summary class="small" style="cursor:pointer">粘贴内容包 · Paste a pack</summary>
      <p class="small muted">从任何一个 Claude 聊天里拿到的内容包，贴在这里。Paste a pack from any Claude chat.</p>
      <textarea class="inp" id="pk-text" rows="3" placeholder='{"zwpack": 1, "id": …}' autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%;font-size:16px"></textarea>
      <button class="btn soft" id="pk-go">加进来 Add it</button><div id="pk-msg" class="small"></div></details></div>`;
}
// requests the run didn't do, grouped by reason (the run's own words). Only ones the input check held back as
// instruction-like get the "someone may have your token" advice.
function heldHtml() {
  const list = (S.heldLog || []).filter(h => h.t > (S.heldSeen || 0)); if (!list.length) return "";
  const by = new Map(); for (const h of list) { const k = h.why || ""; by.set(k, (by.get(k) || []).concat([h])); }
  const sus = list.some(h => /instructions to an AI|tool use|looked like instructions/.test(h.why || ""));
  const kind = rid => /^y:/.test(rid) ? "歌词 lyrics" : /^q:/.test(rid) ? "问题 questions" : /^[rc]:/.test(rid) ? "批改 grading" : /^w:/.test(rid) ? "例句 sentence" : /^p:/.test(rid) ? "短文 passage" : "";
  return `<div class="small" style="padding:8px 10px;border-radius:10px;background:color-mix(in srgb, ${sus ? "var(--bad)" : "var(--line)"} ${sus ? 10 : 45}%, transparent)"><b>${sus ? "⚠ " : ""}Claude 没做的请求 · Requests the daily run didn't do</b><br>
    ${[...by].map(([why, hs]) => `${hs.length > 1 ? `<b>×${hs.length}</b> ` : ""}${esc([...new Set(hs.map(h => kind(h.rid)).filter(Boolean))].join(", "))}${kind(hs[0].rid) ? " — " : ""}${esc(why)}`).join("<br>")}
    ${sus ? `<br>有的内容像是给 AI 的指令：如果不是你写的，可能有人拿到了你的 GitHub 钥匙，用 换钥匙 换一把，再在 GitHub 上作废旧的。· Some text looked like instructions to an AI: if you didn't write it, someone may have your GitHub token — make a new one with 换钥匙 and revoke the old one on GitHub.` : ""}
    <br><button class="tagc" id="heldok" style="margin-top:6px">知道了 OK</button></div>`;
}
function bindPackCard() {
  const ho = $("#heldok"); if (ho) ho.onclick = () => { S.heldSeen = now(); save(); refreshStock(); };
  const c = $("#packcard"); if (!c) return;
  const setStock = (patch, redraw) => {
    S.settings = setSettings({ stock: Object.assign({}, (S.settings || {}).stock, patch) }); save();
    FORECAST = null; if (redraw) render(); else refreshStock();
    setTimeout(() => { if (COL) outboxSoon(true); else { const cfg = stockCfg(); FORECAST = forecast(cfg.days, cfg.mins); refreshStock(); } }, 30);
  };
  const a = $("#pk-ahead"); if (a) a.onchange = () => setStock({ ahead: +a.value }, false);
  const setReading = patch => { S.settings = setSettings({ reading: Object.assign({}, (S.settings || {}).reading, patch) }); save(); FORECAST = null; refreshStock(); setTimeout(() => outboxSoon(true), 30); };
  $("#pk-read").onchange = e => setReading({ perDay: +e.target.value });
  $$("[data-genre]", c).forEach(b => b.onchange = () => { const on = $$("[data-genre]", c).filter(x => x.checked).map(x => x.dataset.genre); setReading({ genres: on.length && on.length < PSG_GENRES.length ? on : null }); });
  const fa = $("#fw-ask"); if (fa) fa.onclick = () => { const v = $("#fw-topic").value.trim().slice(0, 40); if (!v) { toast("写一个话题 · Type a topic"); return; } addReq({ rid: "wt:" + now().toString(36), kind: "fwtopic", topic: v }); $("#fw-topic").value = ""; toast("下次运行时出题 · Prompts come with the next daily run"); refreshStock(); };
  $("#pk-more").onclick = () => { const t = now(); addReq({ rid: "p:" + t.toString(36), kind: "passage", genre: $("#pk-g1").value || null, topic: $("#pk-topic").value.trim().slice(0, 80) }); toast("请 Claude 写了 · Asked; it arrives with the next daily run", 3500); refreshStock(); };
  $("#pk-mins").onchange = e => setStock(e.target.value === "auto" ? { minsSet: false } : { minsSet: true, mins: +e.target.value }, false);
  $("#pk-from").onchange = $("#pk-to").onchange = () => setStock({ from: $("#pk-from").value || undefined, to: $("#pk-to").value || undefined }, true);
  const clr = $("#pk-clr"); if (clr) clr.onclick = () => setStock({ from: undefined, to: undefined }, true);
  $("#pk-go").onclick = () => {
    const msg = $("#pk-msg");
    try {
      const pk = parsePack($("#pk-text").value), r = applyPack(pk, "paste");
      msg.innerHTML = r.dup ? "这个内容包已经加过了 · This pack was already added." : `✓ ${esc(packSummary(r))}${r.bad ? ` · ${r.bad} 个格式不对，没用 · ${r.bad} malformed, skipped` : ""}`;
      if (!r.dup) { $("#pk-text").value = ""; FORECAST = null; outboxSoon(true); if (!COL) setTimeout(() => { const cfg = stockCfg(); FORECAST = forecast(cfg.days, cfg.mins); refreshStock(); }, 30); }
    } catch (e) { msg.innerHTML = `<span style="color:var(--bad)">${esc(e.message || String(e))}</span>`; }
  };
  if (!FORECAST || FORECAST.t !== S.updatedAt) setTimeout(() => { const cfg = stockCfg(); FORECAST = forecast(cfg.days, cfg.mins); refreshStock(); }, 30);
}

/* ============ one-time: rescore a placement taken before timing counted ============ */
function rescoreLastPlacement() {
  const run = (S.placementLog || []).slice(-1)[0];
  if (!run || run.timed || !S.skills) return;
  const ctxText = w => { for (const lv of C.placement.ctx) for (const x of lv) if (x.w === w) return x.s; return w; };
  const textOf = a => a.sec === "ctx" ? ctxText(a.id) : a.sec === "seg" ? (SEG.get(a.id) || {}).s : a.id;
  const nLevels = { ctx: C.placement.ctx.length, seg: C.placement.seg.length, news: C.placement.news.length };
  for (const sec of ["ctx", "seg", "news"]) {
    const right = run.answers.filter(a => a.sec === sec && a.ok);
    if (!right.length || !run.levels || run.levels[sec] == null) continue;
    const ratios = right.map(a => a.ms / expectedMs(sec, textOf(a)));
    const credits = right.map(a => { const t = timeCredit(sec, a.ms, textOf(a), ratios); a.credit = t.credit == null ? 1 : t.credit; return a.credit; });
    const fluency = credits.reduce((x, y) => x + y, 0) / credits.length;
    S.skills[sec] = Math.max(0.05, run.levels[sec] / nLevels[sec]) * fluency;
  }
  run.skills = Object.assign({}, S.skills);
  run.timed = true; run.rescored = now();
  save();
}

/* ============ new version ready (2026-11-16) ============ */
// On a slow connection the offline copy opens the saved version and the new one finishes downloading later (sw.js NET_WAIT).
// Then a slim line at the top offers to switch. Never reloads by itself, and never shows mid-card or mid-song (busyView):
// it waits for the next screen. ✕ hides it for that version until the app is opened again.
const UPD = { ver: null, hide: null };
const UPD_RE = new RegExp("const APP_" + "VERSION = \"([^\"]+)\""); // split so this line doesn't match itself
const verNum = v => { const m = /zwlgf-v(\d+)/.exec(v || ""); return m ? +m[1] : 0; };
async function checkUpdate() {
  if (APP_VERSION.startsWith("__") || !("caches" in window)) return;
  try {
    const r = await caches.match(location.href.split("#")[0], { ignoreSearch: true }) || await caches.match("index.html", { ignoreSearch: true });
    if (!r) return;
    const m = UPD_RE.exec(await r.text()), v = m && m[1];
    const newer = v && v !== APP_VERSION && !v.startsWith("__") && verNum(v) >= verNum(APP_VERSION);
    if ((newer ? v : null) !== UPD.ver) { UPD.ver = newer ? v : null; drawUpdate(); }
  } catch (e) {}
}
function drawUpdate() {
  const old = $("#updline"); if (old) old.remove();
  if (!UPD.ver || UPD.hide === UPD.ver || busyView()) return;
  const d = document.createElement("div"); d.id = "updline"; d.className = "card updline";
  d.innerHTML = `<span class="small">新版本已下载 · New version ready</span><button class="btn soft" id="upd-go">切换 Switch</button><button class="btn ghost" id="upd-x" aria-label="以后再说 Later">✕</button>`;
  $("#main").prepend(d);
  $("#upd-go").onclick = () => { save(); location.reload(); };
  $("#upd-x").onclick = () => { UPD.hide = UPD.ver; d.remove(); };
}

/* ============ boot ============ */
(async function boot() {
  try { await loadData(); loadSlang(); }
  catch (e) { $("#main").innerHTML = `<div class="card"><h2>加载失败</h2><p class="muted">Couldn't load the word data. Check your connection and reload.</p></div>`; return; }
  $("#tabs").hidden = false;
  rescoreLastPlacement();
  migrateSen();
  migrateFsrs();
  housekeep();
  render();
  connectRemote();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { PERSISTED = v; if (VIEW === "me") render(); }).catch(() => {}); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(e => noteErr("offline copy: register", e));
    navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "page-saved") checkUpdate(); });
    navigator.serviceWorker.addEventListener("controllerchange", () => checkUpdate());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
    setTimeout(checkUpdate, 1500);
  }
})();
</script>
