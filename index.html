<title>中文练功房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f4ba8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width column, bottom tab bar; practice cards fill the column. Grid-paper (稿纸) answer boxes are the signature detail. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#18202b; --muted:#5b6676; --line:#dce1e8;
  --accent:#2f4ba8; --accent-ink:#ffffff; --accent-soft:#e3e8f7;
  --good:#1d8566; --good-soft:#dcf1ea; --bad:#c2412d; --bad-soft:#f8e2dd; --gold:#a77a14; --gold-soft:#f5ead0;
  --grid:rgba(47,75,168,.10);
  --f-ui:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong","SimSun","PingFang SC",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12;
  --grid:rgba(142,166,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12;
  --grid:rgba(142,166,255,.12); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:.01em}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.zh{font-family:var(--f-zh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip.news{background:var(--gold-soft)} .chip.book{background:var(--good-soft)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .date{font-size:13px;color:var(--muted)}
/* time buttons */
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.time b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.time span{font-size:12px;color:var(--muted)}
.time.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.time.hot span{color:inherit;opacity:.8}
.mix{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:600px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12px}
nav.tabs button .zh{font-size:18px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* session */
.sbar{display:flex;align-items:center;gap:12px}
.cells{flex:1;display:flex;gap:3px;flex-wrap:wrap}
.cells i{flex:1 0 8px;max-width:22px;height:8px;border-radius:2px;background:var(--line)}
.cells i.ok{background:var(--good)} .cells i.no{background:var(--bad)} .cells i.now{background:var(--accent)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;font-size:14px}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted)}
.kind{display:flex;justify-content:space-between;align-items:center}
.prompt-en{font-size:19px;line-height:1.45;font-weight:500}
.sent{font-family:var(--f-zh);font-size:23px;line-height:1.75;overflow-wrap:anywhere}
.sent mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 2px;text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.5}
.opt.zh{font-size:19px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
/* tiles */
.built{min-height:62px;border-radius:12px;border:1px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 30px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-zh);font-size:19px;padding:7px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid transparent}
.tile.used{visibility:hidden}
/* grid-paper answer */
.paper{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--f-zh);font-size:22px;line-height:34px;color:var(--ink);
  background-color:var(--surface);background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px);background-size:34px 34px;background-position:9px 7px}
.hint{font-size:14px;color:var(--muted)} .hint b{font-family:var(--f-zh);color:var(--ink);font-size:17px}
/* feedback */
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.mid{background:var(--gold-soft)}
.fb .verdict{font-weight:700;font-size:15px}
.fb .model{font-family:var(--f-zh);font-size:19px;line-height:1.6}
.fb ul{margin:0;padding-left:18px}
.fb .alts{font-family:var(--f-zh);font-size:15px;color:var(--muted)}
/* segmentation */
.segline{display:flex;flex-wrap:wrap;row-gap:12px;font-family:var(--f-zh);font-size:25px;line-height:1}
.segline .c{position:relative;padding:6px 7px;border-radius:6px}
.segline .c.tap{cursor:pointer}
.segline .c.tap:hover{background:var(--accent-soft)}
.segline .c.cut::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--accent)}
.segline .c.miss::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--bad)}
.segline .c.extra::after{background:var(--bad);opacity:.35}
.segline .c.p{color:var(--muted)}
.chunks{font-family:var(--f-zh);font-size:19px;line-height:1.9}
.chunks span{border-bottom:2px solid var(--accent);margin-right:8px;white-space:nowrap}
.how{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.how-ex{font-size:20px}
.how-ex i,.chunks i.may{display:inline-block;width:0;height:1em;margin:0 6px;vertical-align:-2px}
.how-ex i.must{border-left:3px solid var(--accent)}
.how-ex i.may,.chunks i.may{border-left:2px dotted var(--muted)}
.offline{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
/* reader */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pitem h3{font-family:var(--f-zh);font-size:18px;font-weight:700}
.reading{font-family:var(--f-zh);font-size:21px;line-height:2;display:flex;flex-direction:column;gap:14px}
.reading p{overflow-wrap:anywhere}
.tk{cursor:pointer;border-radius:4px;white-space:nowrap}
.tk:hover{background:var(--accent-soft)}
.tk.looked{background:var(--gold-soft)}
.spaced .tk{margin-right:.32em;box-shadow:inset 0 -2px 0 var(--line)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) 22px;box-shadow:0 -10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.sheet .w{font-family:var(--f-zh);font-size:30px;font-weight:700}
.chars{display:flex;flex-direction:column;gap:4px;font-size:14px}
.chars span.zh{font-size:17px;margin-right:6px}
.tier{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tier.s{background:var(--good-soft)} .tier.f,.tier.k{background:var(--gold-soft)} .tier.l{background:var(--bad-soft)} .tier.u,.tier.n{background:var(--accent-soft)}
/* progress */
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.6em;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--line);margin-bottom:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
textarea.code{width:100%;min-height:80px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.end .big{font-size:52px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.sent{font-size:21px}.times{grid-template-columns:repeat(2,1fr)}}
</style>

<div id="app"><main id="main"><div class="card"><p class="muted">正在加载… Loading…</p></div></main></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="home"><span class="zh">练</span>今日 Today</button>
  <button data-tab="read"><span class="zh">读</span>阅读 Read</button>
  <button data-tab="me"><span class="zh">进</span>进度 Progress</button>
</div></nav>

<script>
"use strict";
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PUNCT_RE = /[\p{P}\p{S}\s]/u;
const isPunct = ch => PUNCT_RE.test(ch) || /\p{Extended_Pictographic}/u.test(ch);
const norm = s => Array.from(String(s || "")).filter(c => !isPunct(c)).join("").replace(/儿(?=[^一-鿿]|$)/g, "儿");
const now = () => Date.now();
const DAY = 864e5, MIN = 6e4;
const dayKey = (t = now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function toast(msg, ms = 2200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
const pct = x => Math.round((x || 0) * 100) + "%";

/* ============ state & storage ============ */
const LS_KEY = "zwlgf:state:v1";
function freshState() {
  return { v: 1, updatedAt: 0, placed: false, skills: null, items: {}, recent: {}, log: {}, bank: {}, reads: {}, gen: { ladder: [], passages: [] }, best: { combo: 0 } };
}
let S = freshState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}

let DB = null, UID = null, remoteBusy = false, remoteDirty = false, remoteTimer = null;
function save() {
  S.updatedAt = now();
  // trim
  for (const k in S.recent) if (S.recent[k].length > 40) S.recent[k] = S.recent[k].slice(-40);
  const days = Object.keys(S.log).sort(); while (days.length > 120) delete S.log[days.shift()];
  if (S.gen.passages.length > 12) S.gen.passages = S.gen.passages.slice(-12);
  if (S.gen.ladder.length > 160) S.gen.ladder = S.gen.ladder.slice(-160);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (DB && UID) { remoteDirty = true; clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 2500); }
}
async function pushRemote() {
  if (!DB || !UID || remoteBusy || !remoteDirty) return;
  remoteBusy = true; remoteDirty = false;
  try { await DB.doc("data/users/" + UID + "/state").set(JSON.parse(JSON.stringify(S))); }
  catch (e) { if (e && e.code === "unavailable") remoteDirty = true; }
  remoteBusy = false;
  if (remoteDirty) remoteTimer = setTimeout(pushRemote, 4000);
}
async function connectRemote() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; UID = id;
    const snap = await DB.doc("data/users/" + UID + "/state").get();
    if (snap.exists) {
      const remote = JSON.parse(JSON.stringify(snap.data()));
      if ((remote.updatedAt || 0) !== (S.updatedAt || 0)) {
        S = mergeStates(S, remote); indexGen();
        try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
        remoteDirty = true; pushRemote();
        if (!busyView()) render();
      }
    } else if (S.updatedAt) { remoteDirty = true; pushRemote(); }
    syncNote = "进度已同步到你的 Claude 账号（手机和电脑通用）";
    if (VIEW === "me") render();
  } catch (e) {}
}
let syncNote = window.claude ? "正在连接同步…" : "离线版：进度保存在这台设备上。用“导出/导入”在设备间搬运。";

/* ============ merge two saved states (sync + import never lose work) ============ */
function mergeStates(a, b) {
  const newerFirst = (a.updatedAt || 0) >= (b.updatedAt || 0);
  const m = Object.assign(freshState(), JSON.parse(JSON.stringify(newerFirst ? a : b)));
  const o = JSON.parse(JSON.stringify(newerFirst ? b : a));
  for (const id in o.items || {}) {
    const x = o.items[id], y = m.items[id];
    if (!y || (x.n || 0) > (y.n || 0) || ((x.n || 0) === (y.n || 0) && (x.due || 0) > (y.due || 0))) m.items[id] = x;
  }
  for (const k in o.bank || {}) if (!m.bank[k]) m.bank[k] = o.bank[k];
  for (const k in o.reads || {}) if (!m.reads[k] || (o.reads[k].t || 0) > (m.reads[k].t || 0)) m.reads[k] = o.reads[k];
  for (const d in o.log || {}) {
    const x = o.log[d], y = m.log[d];
    m.log[d] = !y ? x : { n: Math.max(x.n, y.n), ok: Math.max(x.ok, y.ok), sec: Math.max(x.sec, y.sec) };
  }
  const byId = (p, q, key) => { const seen = new Set(p.map(z => z[key])); return p.concat(q.filter(z => !seen.has(z[key]))); };
  m.gen = { ladder: byId(m.gen.ladder || [], (o.gen || {}).ladder || [], "id"), passages: byId(m.gen.passages || [], (o.gen || {}).passages || [], "id") };
  m.placementLog = byId(m.placementLog || [], o.placementLog || [], "t").sort((p, q) => p.t - q.t).slice(-3);
  m.pending = byId(m.pending || [], o.pending || [], "k");
  m.graded = byId(m.graded || [], o.graded || [], "k").sort((p, q) => q.t - p.t).slice(0, 20);
  m.best = { combo: Math.max((m.best || {}).combo || 0, (o.best || {}).combo || 0) };
  m.placed = !!(m.placed || o.placed);
  if (!m.skills && o.skills) { m.skills = o.skills; m.recent = o.recent || {}; }
  for (const k of ["segSeen", "lastExport", "lastImport"]) m[k] = Math.max(m[k] || 0, o[k] || 0) || undefined;
  m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return m;
}

/* ============ connection status ============ */
const HOSTED = !!(window.claude && window.claude.use);
let ONLINE = navigator.onLine !== false;
function drawOffline() {
  let b = $("#offbar");
  if (!HOSTED || ONLINE) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "offbar"; b.className = "offline"; $("#app").prepend(b); }
  b.textContent = "离线中 · Offline. Practice keeps working and saves on this device; writing gets Claude's feedback once you reconnect. Don't close this page until you're back online.";
}
addEventListener("online", () => { ONLINE = true; drawOffline(); processPending(); if (DB && UID) { remoteDirty = true; pushRemote(); } });
addEventListener("offline", () => { ONLINE = false; drawOffline(); });
let PERSISTED = null;

/* ============ AI (Claude-hosted only) ============ */
let AI = null;
if (window.claude && window.claude.use) claude.use("sample").then(s => { AI = s; if (VIEW === "me" || VIEW === "read") render(); processPending(); }).catch(() => {});
function aiErr(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared") { AI = null; return "AI 未授权，已改用自评。"; }
  if (c === "rate_limited") return "AI 调用太频繁，稍后再试。";
  if (c === "invalid_json") return "AI 返回格式有误，再试一次。";
  return "AI 暂时不可用。";
}

/* ============ data ============ */
let DICT = new Map(), C = null, ANKI = { s: 0, f: 0, k: 0, l: 0, u: 0 };
const LADDER = new Map(), SEG = new Map(), CTX = new Map(), PSG = new Map();
async function loadData() {

  c.ctx.forEach(x => CTX.set(x.id, x));

}
function indexGen() {
  (S.gen.ladder || []).forEach(x => LADDER.set(x.id, x));
  (S.gen.passages || []).forEach(x => PSG.set(x.id, x));
}
const TIER_NAME = { s: "熟词", f: "在忘", k: "不稳", l: "顽固词", u: "没学过", n: "词库外" };
function lookup(tok, gl = {}) {
  const key = tok.replace(/\//g, "");
  const d = DICT.get(key);
  const g = gl[key] || gl[tok];
  if (d) return { py: d.py, gl: d.gl, tier: d.tier, lv: d.lv, extra: g && g[1] !== d.gl ? g[1] : "" };
  if (g) return { py: g[0], gl: g[1], tier: "n" };

}
function charBreak(tok) {
  return Array.from(tok.replace(/\//g, "")).filter(c => !isPunct(c)).map(ch => { const d = DICT.get(ch); return { ch, py: d ? d.py : "", gl: d ? d.gl : "" }; });
}

/* ============ ladder helpers ============ */
function ladParts(item) {
  const toks = item.zh.split("|");
  let keyIdx = toks.findIndex(t => t.startsWith("["));
  const clean = toks.map(t => t.replace(/[\[\]]/g, ""));
  return { toks: clean, keyIdx, key: clean[keyIdx], model: clean.join("") };
}
const accepted = item => { const { model } = ladParts(item); return new Set([model, ...(item.alt || [])].map(norm)); };

/* ============ segmentation helpers ============ */
const PARTICLES = new Set(["了", "的", "地", "得", "着", "过", "吗", "吧", "呢", "啊", "呀"]);
function parseSeg(s) {
  const chars = [], req = new Set(), opt = new Set(), spans = [];
  const toks = s.split("|");
  toks.forEach((tok, ti) => {
    const start = chars.length;
    const parts = tok.split("/");
    parts.forEach((p, pi) => { for (const ch of Array.from(p)) chars.push(ch); if (pi < parts.length - 1) opt.add(chars.length - 1); });
    spans.push({ start, end: chars.length - 1, text: parts.join("") });
    if (ti < toks.length - 1) req.add(chars.length - 1);
  });
  for (const b of [...req]) {
    const L = spans.find(sp => sp.end === b), R = spans.find(sp => sp.start === b + 1);
    if ((L && PARTICLES.has(L.text)) || (R && PARTICLES.has(R.text))) { req.delete(b); opt.add(b); }
  }
  const fixed = new Set();
  for (let i = 0; i < chars.length - 1; i++) if (isPunct(chars[i]) || isPunct(chars[i + 1])) fixed.add(i);
  for (const b of fixed) { req.delete(b); opt.delete(b); }
  // every other gap is inside a word: cutting there is a mistake
  const inside = new Set();
  for (let i = 0; i < chars.length - 1; i++) if (!req.has(i) && !opt.has(i) && !fixed.has(i)) inside.add(i);
  return { chars, req, opt, fixed, inside, spans };
}

/* ============ SRS ============ */
const LAD_NEXT = { 1: 10 * MIN, 2: 1 * DAY, 3: 2 * DAY, 4: 4 * DAY };
const BOX_IVL = [0.5, 1, 3, 7, 21, 60].map(d => d * DAY);
function skillVal(k) {
  const base = S.skills ? S.skills[k] : 0.5;
  const r = S.recent[k] || [];
  if (r.length < 8) return base;
  const avg = r.reduce((a, b) => a + b, 0) / r.length;
  return 0.4 * base + 0.6 * avg;
}
function pushRecent(k, v) { (S.recent[k] = S.recent[k] || []).push(v); }
function logDay(sec, ok) { const k = dayKey(); const d = S.log[k] = S.log[k] || { n: 0, ok: 0, sec: 0 }; d.n++; d.ok += ok ? 1 : 0; d.sec += Math.min(sec, 240); }
function startRung() { return skillVal("pick") >= 0.6 ? 2 : 1; }
function recordLadder(id, rung, score) {
  // score: 0..3 (3 = natural, 2 = acceptable)
  const it = S.items[id] = S.items[id] || { t: "lad", r: rung, due: 0, ivl: 0, n: 0, ok: 0, m: false };
  it.n++;
  const pass = score >= 2;
  if (pass) {
    it.ok++;
    if (rung >= 5) { it.m = true; it.ivl = Math.max(it.ivl * 2.5, 7 * DAY); it.due = now() + it.ivl; it.r = 5; }
    else { it.r = Math.max(it.r, rung + 1); it.due = now() + LAD_NEXT[rung]; }
  } else { it.r = Math.max(1, rung - 1); it.ivl = 0; it.due = now() + 10 * MIN; }
  pushRecent(rung >= 4 ? "write" : "pick", rung >= 4 ? score / 3 : (pass ? 1 : 0));
  save();
  return it;
}
function recordBox(id, t, ok, cat) {
  const it = S.items[id] = S.items[id] || { t, b: 0, due: 0, n: 0, ok: 0 };
  it.n++;
  if (ok) { it.ok++; it.b = Math.min(5, it.b + 1); it.due = now() + BOX_IVL[it.b]; }
  else { it.b = 0; it.due = now() + 10 * MIN; }
  if (cat) pushRecent(cat, ok ? 1 : 0);
  save();
}

/* ============ session builder ============ */
function weights() {
  const w = {
    lad: (1.15 - (skillVal("pick") + skillVal("write")) / 2) * 1.7,
    seg: (1.15 - (skillVal("seg") + skillVal("news")) / 2) * 1.0,
    ctx: (1.15 - skillVal("ctx")) * 0.85
  };
  const sum = w.lad + w.seg + w.ctx;
  for (const k in w) w[k] /= sum;
  return w;
}
function candidates(cat) {
  const t = now(), due = [], fresh = [];
  if (cat === "lad") {
    for (const [id] of LADDER) { const it = S.items[id]; if (!it) fresh.push({ t: "lad", id, r: startRung() }); else if (it.due <= t) due.push({ t: "lad", id, r: it.r, due: it.due }); }
  } else if (cat === "seg") {
    for (const [id] of SEG) { const it = S.items[id]; if (!it) fresh.push({ t: "seg", id }); else if (it.due <= t) due.push({ t: "seg", id, due: it.due }); }
  } else {
    for (const [id] of CTX) { const it = S.items[id]; if (!it) fresh.push({ t: "ctx", id }); else if (it.due <= t) due.push({ t: "ctx", id, due: it.due }); }
    for (const id in S.bank) { const it = S.items["B:" + id]; if (!it) fresh.unshift({ t: "bank", id }); else if (it.due <= t) due.push({ t: "bank", id, due: it.due }); }
  }
  due.sort((a, b) => a.due - b.due);
  return due.concat(fresh);
}
function buildSession(minutes) {
  if (minutes < 1) {
    const w = weights();
    const order = Object.keys(w).sort((a, b) => w[b] - w[a]);
    for (const cat of order) {
      const c = candidates(cat).map(x => x.t === "lad" && x.r >= 4 ? Object.assign({}, x, { r: 3 }) : x);
      if (c.length) return [c[0]];
    }
    return [];
  }
  const total = { 5: 8, 15: 22, 30: 42 }[minutes] || 10;
  const w = weights();
  const pools = { lad: candidates("lad"), seg: candidates("seg"), ctx: candidates("ctx") };
  const n = {};
  for (const k in w) n[k] = Math.max(pools[k].length ? 1 : 0, Math.round(total * w[k]));
  const picked = { lad: pools.lad.slice(0, n.lad), seg: pools.seg.slice(0, n.seg), ctx: pools.ctx.slice(0, n.ctx) };
  // interleave: production-heavy rhythm
  const out = [];
  const order = ["lad", "ctx", "lad", "seg"];
  let i = 0;
  while (picked.lad.length + picked.seg.length + picked.ctx.length) {
    const k = order[i++ % order.length];
    if (picked[k].length) out.push(picked[k].shift());
  }
  return out;
}

  { key: "news", zh: "新闻理解", en: "One-sentence news items in formal written Chinese, getting denser as you go." },
  { key: "pick", zh: "选最自然", en: "English → pick what a native speaker would say. At higher levels every option is grammatical; only one is natural." },
  { key: "write", zh: "自己写", en: "Five sentences to type in Chinese. Don't look anything up." },

  btn.disabled = true;
  const missed = [...LADDER.values()].filter(x => { const it = S.items[x.id]; return it && it.n > it.ok; }).slice(0, 10).map(x => ladParts(x).key + " (" + x.en + ")");
  const targets = targetWords(10);
  const prompt = `Create 8 English→Chinese production drills for an advanced Mandarin learner (HSK 6+ recognition) whose weakness is producing natural Chinese: they use English word order, long modifiers before nouns, literal word choices, and miss natural chunks (结果, 下起…来, 说得通, V得 complements, 把, 连…都).
Patterns/words they recently got wrong: ${missed.join("; ") || "none yet"}.
Words they keep forgetting (use some as the key chunk): ${targets.join("、")}.
Mix everyday speech, travel in China, and expressing opinions. Each drill is one sentence.
Reply with only a JSON array of 8 objects:
{"en":"natural English sentence","zh":"natural Chinese split into chunks with |, with exactly ONE key chunk in square brackets, e.g. 我|本来|打算|去|，|[结果]|下雨了|。","alt":["2–4 other natural full Chinese answers"],"cx":["3 wrong but tempting fillers for the key slot"],"bad":["2 full Chinese sentences that are English-shaped or wrong, the kind this learner would write"],"why":"one or two English sentences explaining the key chunk and the trap","tag":"pattern|chunk|word|travel|express|leech"}`;
  st.innerHTML = `<span class="spin"></span> 生成中…（通常 30–90 秒）`;
  try {
    const arr = await AI.json(prompt, { modelTier: "default", cache: false, onText: ({ text }) => { st.innerHTML = `<span class="spin"></span> 生成中… ${text.length} 字符`; } });
    if (!Array.isArray(arr)) throw { code: "invalid_json" };
    let added = 0;
    arr.forEach((x, i) => {
      if (!x || typeof x.zh !== "string" || (x.zh.match(/\[/g) || []).length !== 1 || !x.en || !Array.isArray(x.cx) || x.cx.length < 3 || !Array.isArray(x.bad) || x.bad.length < 2) return;
      const item = { id: "G" + now().toString(36) + i, en: String(x.en), zh: x.zh, alt: (x.alt || []).map(String), cx: x.cx.slice(0, 3).map(String), bad: x.bad.slice(0, 2).map(String), why: String(x.why || ""), tag: String(x.tag || "ai"), gen: true };
      S.gen.ladder.push(item); LADDER.set(item.id, item); added++;
    });
    save();
    st.textContent = `加了 ${added} 道新题 — they'll show up in your next sessions.`;
  } catch (e) { st.textContent = aiErr(e); }
  btn.disabled = false;
}

/* ============ boot ============ */
(async function boot() {
  try { await loadData(); }
  catch (e) { $("#main").innerHTML = `<div class="card"><h2>加载失败</h2><p class="muted">Couldn't load the word data. Check your connection and reload.</p></div>`; return; }
  $("#tabs").hidden = false;
  render();
  drawOffline();
  connectRemote();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { PERSISTED = v; if (VIEW === "me") render(); }).catch(() => {}); } catch (e) {}
  if ("serviceWorker" in navigator && !window.claude && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
