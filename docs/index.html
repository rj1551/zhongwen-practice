<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body>
<title>中文练功房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f4ba8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width column, bottom tab bar; practice cards fill the column. Grid-paper (稿纸) answer boxes are the signature detail. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#18202b; --muted:#5b6676; --line:#dce1e8;
  --accent:#2f4ba8; --accent-ink:#ffffff; --accent-soft:#e3e8f7;
  --good:#1d8566; --good-soft:#dcf1ea; --bad:#c2412d; --bad-soft:#f8e2dd; --gold:#a77a14; --gold-soft:#f5ead0; --plum:#8a4fbf;
  --grid:rgba(47,75,168,.10);
  --f-ui:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong","SimSun","PingFang SC",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12; --plum:#c39bf0;
  --grid:rgba(142,166,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171d26; --ink:#e7ecf3; --muted:#97a2b3; --line:#283140;
  --accent:#8ea6ff; --accent-ink:#0e1218; --accent-soft:#1d2848;
  --good:#4cc9a0; --good-soft:#12352b; --bad:#f07a64; --bad-soft:#3d1c16; --gold:#e2b54b; --gold-soft:#3a2e12; --plum:#c39bf0;
  --grid:rgba(142,166,255,.12); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
*,*::before,*::after{touch-action:manipulation} /* no double-tap zoom when tapping answers quickly; pinch zoom still works */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:.01em}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.zh{font-family:var(--f-zh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.fpick{position:relative;cursor:pointer}.fpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip.news{background:var(--gold-soft)} .chip.book{background:var(--good-soft)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .date{font-size:13px;color:var(--muted)}
/* time buttons */
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn.start{font-size:18px;min-height:56px}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.goal{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.goal.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.time{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.time b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.time span{font-size:12px;color:var(--muted)}
.time.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.time.hot span{color:inherit;opacity:.8}
.mix{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:600px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12px}
nav.tabs button .zh{font-size:18px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* session */
.sbar{display:flex;align-items:center;gap:12px}
.cells{flex:1;display:flex;gap:3px;flex-wrap:wrap}
.cells i{flex:1 0 8px;max-width:22px;height:8px;border-radius:2px;background:var(--line)}
.cells i.ok{background:var(--good)} .cells i.no{background:var(--bad)} .cells i.now{background:var(--accent)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;font-size:14px}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted)}
.kind{display:flex;justify-content:space-between;align-items:center}
.prompt-en{font-size:19px;line-height:1.45;font-weight:500}
.sent{font-family:var(--f-zh);font-size:23px;line-height:1.75;overflow-wrap:anywhere}
.sent mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 2px;text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.5}
.opt.zh{font-size:19px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
/* tiles */
.built{min-height:62px;border-radius:12px;border:1px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 30px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-zh);font-size:19px;padding:7px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid transparent}
.tile.used{visibility:hidden}
/* grid-paper answer */
.paper{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--f-zh);font-size:22px;line-height:34px;color:var(--ink);
  background-color:var(--surface);background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px);background-size:34px 34px;background-position:9px 7px}
.hint{font-size:14px;color:var(--muted)} .hint b{font-family:var(--f-zh);color:var(--ink);font-size:17px}
/* feedback */
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.mid{background:var(--gold-soft)}
.fb .verdict{font-weight:700;font-size:15px}
.fb .model{font-family:var(--f-zh);font-size:19px;line-height:1.6}
.fb ul{margin:0;padding-left:18px}
.fb .alts{font-family:var(--f-zh);font-size:15px;color:var(--muted)}
/* segmentation */
.segline{display:flex;flex-wrap:wrap;row-gap:12px;font-family:var(--f-zh);font-size:25px;line-height:1}
.segline .c{position:relative;padding:6px 7px;border-radius:6px}
.segline .c.tap{cursor:pointer}
.segline .c.tap:hover{background:var(--accent-soft)}
.segline .c.cut::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--accent)}
.segline .c.miss::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--bad)}
.segline .c.extra::after{background:var(--bad);opacity:.35}
.segline .c.p{color:var(--muted)}
.chunks{font-family:var(--f-zh);font-size:19px;line-height:1.9}
.chunks span{border-bottom:2px solid var(--accent);margin-right:8px;white-space:nowrap}
.how{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.how-ex{font-size:20px}
.how-ex i,.chunks i.may{display:inline-block;width:0;height:1em;margin:0 6px;vertical-align:-2px}
.how-ex i.must{border-left:3px solid var(--accent)}
.how-ex i.may,.chunks i.may{border-left:2px dotted var(--muted)}
.frames{display:flex;flex-direction:column;gap:4px;font-size:14px}
.frames b{font-family:var(--f-zh);font-size:17px;margin-right:8px}
.syncwarn{background:var(--bad-soft)}
.offline{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
/* reader */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pitem h3{font-family:var(--f-zh);font-size:18px;font-weight:700}
.reading{font-family:var(--f-zh);font-size:21px;line-height:2;display:flex;flex-direction:column;gap:14px}
.reading p{overflow-wrap:anywhere}
.tk{cursor:pointer;border-radius:4px;white-space:nowrap}
.tk:hover{background:var(--accent-soft)}
.tk.looked{background:var(--gold-soft)}
.spaced .tk{margin-right:.32em;box-shadow:inset 0 -2px 0 var(--line)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px max(18px,env(safe-area-inset-left,0px)) 16px;box-shadow:0 -10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto}
.sheet .w{font-family:var(--f-zh);font-size:28px;font-weight:700}
.rds{display:flex;flex-direction:column;gap:6px}
.rd{font-size:14.5px;line-height:1.45}
.rd b{font-size:16px;margin-right:8px}
.rtag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--accent-soft);margin-right:6px}
.rtag.here{background:var(--accent);color:var(--accent-ink)}
.sheet.pop{left:auto;right:auto;bottom:auto;display:block;padding:0}
.sheet.popm{bottom:auto;padding:0 12px} .sheet.popm .in{border-radius:14px;border-bottom:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.tagc{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)} .tagc.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.inp{font:inherit;font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.sheet.pop .in{border-radius:14px;border-bottom:1px solid var(--line);max-height:60vh}
.pitem.done{opacity:.62;background:transparent}
.cue{display:block;padding:4px 8px;margin:0 -8px;border-radius:8px;font-family:var(--f-zh);font-size:19px;line-height:1.7;text-align:left;width:calc(100% + 16px)}
.cue.now{background:var(--accent-soft)} .cue.lost{box-shadow:inset 3px 0 0 var(--gold);background:var(--gold-soft)}
.cues{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.lostbtn{font-size:18px;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent)}
.pitem.done:hover{opacity:.9}
.chip.new{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.toast.act{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:6px 12px}
.toast.act button{color:inherit;font-weight:700;text-decoration:underline;font-size:12.5px}
.chars{display:flex;flex-direction:column;gap:4px;font-size:14px}
.chars span.zh{font-size:17px;margin-right:6px}
.tier{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tier.s{background:var(--good-soft)} .tier.f,.tier.k{background:var(--gold-soft)} .tier.l{background:var(--bad-soft)} .tier.u,.tier.n{background:var(--accent-soft)}
/* progress */
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.6em;gap:10px;align-items:center;font-size:14px}
.bar .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--line);margin-bottom:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
textarea.code{width:100%;min-height:80px;font-family:ui-monospace,monospace;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);word-break:break-all}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.end .big{font-size:52px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.sent{font-size:21px}.times{grid-template-columns:repeat(2,1fr)}}
</style>

<div id="app"><main id="main"><div class="card"><p class="muted">正在加载… Loading…</p></div></main></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="home"><span class="zh">练</span>今日 Today</button>
  <button data-tab="read"><span class="zh">读</span>阅读 Read</button>

</div></nav>

<script>
"use strict";
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PUNCT_RE = /[\p{P}\p{S}\s]/u;
const isPunct = ch => PUNCT_RE.test(ch) || /\p{Extended_Pictographic}/u.test(ch);
const norm = s => Array.from(String(s || "")).filter(c => !isPunct(c)).join("").replace(/儿(?=[^一-鿿]|$)/g, "儿");
let CLOCK_OFF = 0, SIM = false; // the stock-up forecast fast-forwards a copy of your progress
const now = () => Date.now() + CLOCK_OFF;
const DAY = 864e5, MIN = 6e4;
const dayKey = (t = now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function toast(msg, ms = 2200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); placeToasts(); setTimeout(() => t.remove(), ms); }
// Keep toasts at the top of what you can actually see, at normal size, even when the page is zoomed in.
function placeToasts() {
  const v = window.visualViewport;
  $$(".toast").forEach(t => {
    if (!v || v.scale <= 1.01) { t.style.cssText = ""; return; }
    t.style.left = (v.pageLeft + v.width / 2) + "px";
    t.style.top = (v.pageTop + 12 / v.scale) + "px";
    t.style.transform = `translateX(-50%) scale(${1 / v.scale})`; t.style.transformOrigin = "top center";
    t.style.position = "absolute"; t.style.maxWidth = (v.width * v.scale * 0.9) + "px";
  });
}
if (window.visualViewport) { visualViewport.addEventListener("resize", placeToasts); visualViewport.addEventListener("scroll", placeToasts); }
const uid4 = () => Math.random().toString(36).slice(2, 6);
const pct = x => Math.round((x || 0) * 100) + "%";

/* ============ state & storage ============ */
const LS_KEY = "zwlgf:state:v1";
const OFFW_MAX = 50; // offline copy keeps this many written answers for Claude to check later
function freshState() {
  return { v: 1, updatedAt: 0, placed: false, skills: null, items: {}, recent: {}, log: {}, bank: {}, reads: {}, gen: { ladder: [], passages: [], sen: [], mine: [], listen: [] }, best: { combo: 0 } };
}
let S = freshState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}

let DB = null, UID = null, remoteBusy = false, remoteDirty = false, remoteTimer = null;
let SYNC_BYTES = 0, SYNC_FULL = false, LOCAL_FULL = false;
const SYNC_LIMIT = 256 * 1024;
const bytesOf = json => json.length + (json.match(/[^\x00-\x7f]/g) || []).length * 2; // UTF-8 estimate
const GEN_CAP = { ladder: 600, sen: 600, passages: 60, mine: 400, listen: 80 }; // mine = parts of your own texts (also limited by MINE_MAX_CHARS) // generated content kept (all of it travels offline)
function save() {
  if (SIM) return;
  S.updatedAt = now();
  // trim
  for (const k in S.recent) if (S.recent[k].length > 40) S.recent[k] = S.recent[k].slice(-40);
  const days = Object.keys(S.log).sort(); while (days.length > 120) delete S.log[days.shift()];
  for (const k in GEN_CAP) if ((S.gen[k] || []).length > GEN_CAP[k]) S.gen[k] = S.gen[k].slice(-GEN_CAP[k]);
  const json = JSON.stringify(S);
  try { localStorage.setItem(LS_KEY, json); } catch (e) { LOCAL_FULL = true; }
  if (COL) { remoteDirty = true; clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 2500); }
}
/* ---------- account sync: progress split across several documents ----------

    const bin = atob(c.b64);
    if (c.kind === "1") {
      const buf = Uint8Array.from(bin, ch => ch.charCodeAt(0));
      json = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    } else json = decodeURIComponent(escape(bin));
  } catch (e) {
    if (c.kind === "1" && typeof DecompressionStream === "undefined") return fail("这个浏览器太旧，解不开压缩代码 · This browser can't unpack compressed codes; update it, or copy from this app into the other one instead.");
    return fail(cut);
  }
  let data;
  try { data = JSON.parse(json); } catch (e) { return fail(cut); }
  if (!data || data.v !== 1) return fail("版本不对 · This code is from a different app or version.");
  S = mergeStates(S, data); S.lastImport = now(); indexGen(); migrateFsrs(); save(); toast("已合并 Merged — nothing was overwritten"); render(); processSentences();
}
async function genSen(quiet) {

  const prompt = `Create 10 sentence-parsing drills for an advanced Mandarin reader (HSK 6+ vocabulary) who understands formal written Chinese only slowly. Each item is ONE dense sentence in the style of news, official notices, reports or formal writing (simplified Chinese, 20–40 characters), with ONE English multiple-choice question about its precise meaning.
The 4 options must all fit the topic, so elimination doesn't work; the wrong ones differ only in what the structure decides (time frames like 截至/自…起, amounts like 余/近/成, direction like 下降/下降到, negation frames like 并非…而是, modality like 或将/有望/不得, cause vs result).

Reply with only a JSON array of 10 objects:
{"s":"the sentence split into chunks with | (chunk breaks) and / (word breaks inside a chunk), punctuation as its own chunk, e.g. 据|海关/总署|统计|，|出口|增长|6%|。","q":"What does it say?","opts":["correct","wrong","wrong","wrong"],"frames":[["key structure","short English gloss"]],"ft":[null, 0, 1, 0]}
"ft": for each option, the index in "frames" of the structure that option gets wrong (null for the correct first option, null if none). Use some of the misread structures above in some sentences, written exactly as listed.`;
  genStatus("sen", `<span class="spin"></span> 生成中…（通常 30–90 秒）`, true);

      if (Array.isArray(x.ft) && x.ft.length === 4) item.ft = x.ft.map((f, j) => j > 0 && Number.isInteger(f) && f >= 0 && f < item.frames.length ? f : null);

}
async function genLadder(quiet) {
  const genStatus = quiet ? () => {} : window.genStatus;

  const targets = targetWords(10);
  const prompt = `Create 8 English→Chinese production drills for an advanced Mandarin learner (HSK 6+ recognition) whose weakness is producing natural Chinese: they use English word order, long modifiers before nouns, literal word choices, and miss natural chunks (结果, 下起…来, 说得通, V得 complements, 把, 连…都).

Rules: write NEW sentences — never reuse or paraphrase the English examples above. The Chinese must be exactly what a native speaker would write. Choose a context where the key chunk is clearly the most natural choice, in the register it belongs to (a formal word like 当前/从事/便利 in a formal sentence, not in casual talk); avoid contexts where a common everyday synonym would fit just as well. Every "alt" answer must also contain the key chunk.
Reply with only a JSON array of 8 objects:
{"en":"natural English sentence","zh":"natural Chinese split into chunks with |, with exactly ONE key chunk in square brackets, e.g. 我|本来|打算|去|，|[结果]|下雨了|。","alt":["2–4 other natural full Chinese answers"],"cx":["3 wrong but tempting fillers for the key slot"],"bad":["2 full Chinese sentences that are English-shaped or wrong, the kind this learner would write"],"near":["common equally-natural substitutes for the key chunk in this sentence, if any (often none)"],"why":"one or two English sentences explaining the key chunk and the trap","tag":"pattern|chunk|word|travel|express|leech"}`;
  genStatus("lad", `<span class="spin"></span> 生成中…（通常 30–90 秒）`, true);
  try {
    const arr = await AI.json(prompt, { modelTier: "default", cache: false, onText: ({ text }) => genStatus("lad", `<span class="spin"></span> 生成中… ${text.length} 字符`, true) });
    if (!Array.isArray(arr)) throw { code: "invalid_json" };
    let added = 0;
    arr.forEach((x, i) => {
      if (!x || typeof x.zh !== "string" || (x.zh.match(/\[/g) || []).length !== 1 || !x.en || !Array.isArray(x.cx) || x.cx.length < 3 || !Array.isArray(x.bad) || x.bad.length < 2) return;
      const item = { id: "G" + now().toString(36) + uid4() + i, en: String(x.en), zh: x.zh, alt: (x.alt || []).map(String), cx: x.cx.slice(0, 3).map(String), bad: x.bad.slice(0, 2).map(String), why: String(x.why || ""), tag: String(x.tag || "ai"), gen: true };
      if (Array.isArray(x.near) && x.near.length) item.near = x.near.slice(0, 5).map(String);

}

/* ---------- stock up for offline (China) ----------
   The offline copy can't ask Claude for new material. forecast() runs the app's real scheduler forward on a copy
   of your progress (so it follows whatever scheduling and exercise types the app has) and counts how many days of
   practice are left before nothing is due or new. Stocking up generates content until that covers the trip.
   To add a new kind of generated content, add an entry to STOCKERS. */
const STOCKERS = [
  { key: "lad", name: "造句", cap: "ladder", run: () => genLadder(true) },
  { key: "sen", name: "短句", cap: "sen", run: () => genSen(true) },
];
const PSG_KINDS = ["xhs", "news", "travel", "book"];
// minutes/day × days, or trip dates (from/to, "YYYY-MM-DD"): with both dates set they decide the number of days
const stockCfg = () => {
  const c = Object.assign({ mins: 60, days: 21 }, (S.settings || {}).stock);
  c.trip = !!(c.from && c.to && c.to >= c.from);
  if (c.trip) c.days = Math.round((new Date(c.to + "T00:00") - new Date(c.from + "T00:00")) / DAY) + 1;
  return c;
};
function secPerCard() {
  let n = 0, sec = 0; for (const d in S.log) { n += S.log[d].n; sec += S.log[d].sec; }
  return n >= 20 ? Math.max(20, Math.min(60, sec / n)) : 35;
}
const unreadPassages = () => [...PSG.keys()].filter(id => !S.reads[id]).length;
let FORECAST = null;
function forecast(days, mins) {
  const keepS = S, keepOff = CLOCK_OFF;
  SIM = true; S = JSON.parse(JSON.stringify(S)); BUDGET_MINS = mins;
  try {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let covered = 0;
    // v23: each simulated day runs the real session builder (reviews, same-day repeats, divider, new-item budget)
    // for `mins` minutes; typed cards ~90 s, others ~25 s; 85% of drills and 90% of other cards right.
    const cfg = stockCfg(), tripStart = cfg.trip ? new Date(cfg.from + "T00:00").getTime() : 0;
    const base = tripStart > Date.now() + keepOff ? tripStart : midnight(Date.now() + keepOff + DAY); // the trip's first day, or tomorrow
    for (let d = 1; d <= days; d++) {
      CLOCK_OFF = midnight(base + (d - 1) * DAY + 12 * 3600e3) + 9 * 3600e3 - Date.now();
      const used = new Set();
      let sec = 0;
      while (sec < mins * 60) {
        const block = buildBlock(8, used, rnd).filter(c => c.t !== "div" && !c.re);
        if (!block.length) break;
        for (const c of block) {
          if (c.t === "rr") { const pp = PSG.get(c.id), r0 = S.reads[c.id], cpm = (r0 && (r0.lastCpm || r0.cpm)) || 80, rs = pp ? psgChars(pp) / cpm * 60 : 120; recordReread(c.id, cpm); sec += rs; CLOCK_OFF += rs * 1000; continue; }
          if (c.t === "lad") { const ok = rnd() < 0.85; recordLadder(c.id, c.r || 5, ok ? 3 : 0, ok && (c.r === 4 || c.r === 5) ? "x" : undefined); sec += c.r === 4 || c.r === 5 ? 90 : 25; }
          else { const ok = rnd() < 0.9; if (c.t === "bank") recordBox("B:" + c.id, "bank", ok, "ctx"); else if (c.t === "sen") recordSen(c.id, ok, 1); else if (c.t === "frag") recordBox(c.id, "frag", ok, null); else recordBox(c.id, c.t, ok, c.t); sec += 25; }
          CLOCK_OFF += (c.t === "lad" && c.r >= 4 && c.r <= 5 ? 90 : 25) * 1000;
          if (sec >= mins * 60) break;
        }
      }
      if (sec < mins * 60 * 0.9) break;
      covered = d;
    }
    return { days: covered, target: days, unread: unreadPassages(), needPsg: Math.ceil(days / 2), t: keepS.updatedAt };
  } finally { S = keepS; CLOCK_OFF = keepOff; SIM = false; BUDGET_MINS = null; }
}
let STOCK = null;
function stockStatus() {
  const cfg = stockCfg(), f = FORECAST;
  if (!f) return `<p class="small muted"><span class="spin"></span> 估算中… Estimating…</p>`;
  const okCards = f.days >= f.target, okPsg = f.unread >= f.needPsg;
  let h = `<p class="small">练习卡够用 Practice cards last: <b>${okCards ? `≥ ${f.target}` : f.days} 天 days</b> ${okCards ? "✓" : ""}<br>
    没读过的短文 Unread passages: <b>${f.unread}</b> / ${f.needPsg} 篇 needed (one every 2 days) ${okPsg ? "✓" : ""}</p>
    <p class="small muted">Runs the real scheduler forward: about 90 s per typed card and 25 s per other card, 85–90% right, new drills and words paced by the daily budget, new parsing sentences filling the rest. Old sentences being reused don't count.</p>`;
  if (STOCK) {
    const a = STOCK.added;
    h += `<p class="small">${STOCK.running ? `<span class="spin"></span> 备货中 Stocking up…` : "这次 This run:"} +${a.lad} 造句 · +${a.sen} 短句 · +${a.psg} 短文${STOCK.msg ? `<br><span class="muted">${esc(STOCK.msg)}</span>` : ""}</p>`;
    if (!STOCK.running && (a.lad || a.sen || a.psg)) h += `<p class="small"><b>下一步 Next:</b> 导出 Copy code below, then 合并 Merge in the offline copy on your phone.</p>`;
  }
  return h;
}
function stockCard() {
  const cfg = stockCfg();
  const sel = (id, opts, v, unit) => `<select id="${id}" style="font:inherit;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">${opts.map(o => `<option value="${o}" ${o === v ? "selected" : ""}>${o} ${unit}</option>`).join("")}</select>`;
  return `<div class="card"><span class="label">离线备货 · Stock up for offline</span>
    <p class="small muted">${AI ? "The offline copy can't make new material. Stock up here before you go, then carry it over with a copy code." : "How long this copy's material lasts. New material can only be made in the online version."}</p>
    <div class="row small">每天 Daily ${sel("st-mins", [15, 30, 60, 90], cfg.mins, "分钟")} × ${cfg.trip ? `<b>${cfg.days} 天 days</b>` : sel("st-days", [7, 14, 21, 28], cfg.days, "天")}</div>
    <div class="row small" style="gap:6px">或者按行程日期 Or trip dates:
      <input type="date" id="st-from" class="inp" style="width:auto;padding:5px 8px" value="${esc(cfg.from || "")}"> → <input type="date" id="st-to" class="inp" style="width:auto;padding:5px 8px" value="${esc(cfg.to || "")}">
      ${cfg.from || cfg.to ? `<button class="btn ghost" id="st-clr" style="min-height:34px;padding:6px 10px">清除 Clear</button>` : ""}</div>
    ${cfg.trip ? `<p class="small muted">During the trip, new drills and words are spread over the days left, so the stock lasts to the end.</p>` : ""}
    <div id="st-body">${stockStatus()}</div>
    ${AI ? `<div class="row"><button class="btn soft" id="st-go" ${STOCK && STOCK.running ? "hidden" : ""}>开始备货 Stock up</button><button class="btn ghost" id="st-stop" ${STOCK && STOCK.running ? "" : "hidden"}>停止 Stop</button></div>` : ""}</div>`;
}
function refreshStock() { const b = $("#st-body"); if (b) b.innerHTML = stockStatus(); const g = $("#st-go"), x = $("#st-stop"); if (g) g.hidden = !!(STOCK && STOCK.running); if (x) x.hidden = !(STOCK && STOCK.running); }
function updateForecast() {
  const cfg = stockCfg();
  FORECAST = null; refreshStock();
  setTimeout(() => { FORECAST = forecast(cfg.days, cfg.mins); refreshStock(); }, 30);
}
function bindStock() {
  const m = $("#st-mins"), d = $("#st-days"), f = $("#st-from"), t = $("#st-to"); if (!m) return;
  const set = (redraw) => {
    const prev = (S.settings || {}).stock || {};
    S.settings = Object.assign({}, S.settings, { stock: { mins: +m.value, days: d ? +d.value : prev.days || 21, from: f.value || undefined, to: t.value || undefined } });
    save();
    if (redraw) render(); else updateForecast();
  };
  m.onchange = () => set(false); if (d) d.onchange = () => set(false);
  f.onchange = () => set(true);
  t.onchange = f.onchange;
  const clr = $("#st-clr"); if (clr) clr.onclick = () => { f.value = ""; t.value = ""; set(true); };
  const go = $("#st-go"); if (go) go.onclick = stockUp;
  const st = $("#st-stop"); if (st) st.onclick = () => { if (STOCK) { STOCK.stop = true; STOCK.msg = "停下来了 · Stopping after the current batch…"; refreshStock(); } };
  const cfg = stockCfg();
  if (!FORECAST || FORECAST.t !== S.updatedAt || FORECAST.target !== cfg.days) updateForecast();
}
async function stockUp() {
  if (!AI || (STOCK && STOCK.running)) return;
  const cfg = stockCfg();
  STOCK = { running: true, stop: false, added: { lad: 0, sen: 0, psg: 0 }, msg: "" }; refreshStock();
  for (let round = 0; round < 60 && !STOCK.stop; round++) {
    FORECAST = forecast(cfg.days, cfg.mins); refreshStock();
    const needCards = FORECAST.days < cfg.days, needPsg = FORECAST.unread < FORECAST.needPsg;
    if (!needCards && !needPsg) { STOCK.msg = "够了 ✓ Enough for the whole trip."; break; }
    const jobs = [];
    if (needCards) for (const g of STOCKERS) if ((S.gen[g.cap] || []).length < GEN_CAP[g.cap]) jobs.push(g.run().then(n => { STOCK.added[g.key] += n || 0; refreshStock(); }));
    if (needPsg && S.gen.passages.length < GEN_CAP.passages) jobs.push(genPassage(PSG_KINDS[round % PSG_KINDS.length], true).then(n => { STOCK.added.psg += n || 0; refreshStock(); }));
    if (!jobs.length) { STOCK.msg = "生成的内容到上限了 · Reached the limit for generated content."; break; }
    const res = await Promise.allSettled(jobs);
    const bad = res.filter(r => r.status === "rejected");
    if (bad.length === res.length) { STOCK.msg = aiErr(bad[0].reason) + " 可以稍后继续 · You can continue later; nothing made so far is lost."; break; }
  }
  if (STOCK.stop) STOCK.msg = "已停止 · Stopped. Everything made so far is kept.";
  STOCK.running = false;
  FORECAST = forecast(cfg.days, cfg.mins);
  if (VIEW === "me") render(); else toast("备货完成 · Stock-up finished");
}

/* ============ one-time: rescore a placement taken before timing counted ============ */
function rescoreLastPlacement() {
  const run = (S.placementLog || []).slice(-1)[0];
  if (!run || run.timed || !S.skills) return;
  const ctxText = w => { for (const lv of C.placement.ctx) for (const x of lv) if (x.w === w) return x.s; return w; };
  const textOf = a => a.sec === "ctx" ? ctxText(a.id) : a.sec === "seg" ? (SEG.get(a.id) || {}).s : a.id;
  const nLevels = { ctx: C.placement.ctx.length, seg: C.placement.seg.length, news: C.placement.news.length };
  for (const sec of ["ctx", "seg", "news"]) {
    const right = run.answers.filter(a => a.sec === sec && a.ok);
    if (!right.length || !run.levels || run.levels[sec] == null) continue;
    const ratios = right.map(a => a.ms / expectedMs(sec, textOf(a)));
    const credits = right.map(a => { const t = timeCredit(sec, a.ms, textOf(a), ratios); a.credit = t.credit == null ? 1 : t.credit; return a.credit; });
    const fluency = credits.reduce((x, y) => x + y, 0) / credits.length;
    S.skills[sec] = Math.max(0.05, run.levels[sec] / nLevels[sec]) * fluency;
  }
  run.skills = Object.assign({}, S.skills);
  run.timed = true; run.rescored = now();
  save();
}

/* ============ boot ============ */
(async function boot() {
  try { await loadData(); }
  catch (e) { $("#main").innerHTML = `<div class="card"><h2>加载失败</h2><p class="muted">Couldn't load the word data. Check your connection and reload.</p></div>`; return; }
  $("#tabs").hidden = false;
  rescoreLastPlacement();
  migrateSen();
  migrateFsrs();
  render();
  drawOffline();
  connectRemote();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { PERSISTED = v; if (VIEW === "me") render(); }).catch(() => {}); } catch (e) {}
  if ("serviceWorker" in navigator && !window.claude && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
